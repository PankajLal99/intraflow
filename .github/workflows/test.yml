name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp_password
          POSTGRES_DB: whatsapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd agent-orchestrator
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock
          pip install ruff black mypy bandit

      - name: Run linting (Ruff)
        run: |
          cd agent-orchestrator
          ruff check src/

      - name: Check formatting (Black)
        run: |
          cd agent-orchestrator
          black --check src/

      - name: Type checking (MyPy)
        run: |
          cd agent-orchestrator
          mypy src/ --ignore-missing-imports || true

      - name: Security audit (Bandit)
        run: |
          cd agent-orchestrator
          bandit -r src/ -ll || true

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+asyncpg://whatsapp:whatsapp_password@localhost:5432/whatsapp_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_key_for_testing
          WEBHOOK_SECRET: test_webhook_secret_key
        run: |
          cd agent-orchestrator
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./agent-orchestrator/coverage.xml
          flags: backend
          name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linting
        run: |
          cd frontend
          npm run lint || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: whatsapp
          POSTGRES_PASSWORD: whatsapp_password
          POSTGRES_DB: whatsapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd agent-orchestrator
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Initialize database
        env:
          PGPASSWORD: whatsapp_password
        run: |
          psql -h localhost -U whatsapp -d whatsapp_test -f database/init.sql

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://whatsapp:whatsapp_password@localhost:5432/whatsapp_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test_jwt_secret_key_for_testing
          WEBHOOK_SECRET: test_webhook_secret_key
        run: |
          cd agent-orchestrator
          pytest tests/test_integration.py -v
